<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable System V2</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<header class="topbar">

    <h1>生成課表小系統</h1>

    <div class="toolbar">

        <button id="importExcelBtn">
            匯入Excel
        </button>

        <input
            type="file"
            id="excelInput"
            accept=".xlsx,.xls"
            hidden>

        <button id="importJsonBtn">
            匯入JSON
        </button>

        <input
            type="file"
            id="jsonInput"
            accept=".json"
            hidden>

        <button id="exportBtn">
            匯出JSON
        </button>
        
        <button id="exportImageBtn">
            匯出課表圖片
        </button>

        <button id="addCourseBtn">
            新增課程
        </button>
        
        <button id="deleteAllModulesBtn">
            刪除所有模組
        </button>

        <button id="clearBtn">
            清空課表
        </button>

    </div>

</header>

<main class="container">

    <aside class="sidebar">

        <h2>課程模組</h2>

        <input
            id="searchInput"
            type="text"
            placeholder="搜尋課程...">

        <select id="categoryFilter">


            <option value="">
                全部分類
            </option>

            <option value="必修">
                必修
            </option>

            <option value="選修">
                選修
            </option>

            <option value="通識">
                通識
            </option>

            <option value="體育">
                體育
            </option>

            <option value="其他">
                其他
            </option>

        </select>

        <div id="moduleList">

        </div>

    </aside>

    <section class="content">

        <div id="timetable">

        </div>

    </section>

</main>

<!-- Modal -->

<div
    class="modal hidden"
    id="courseModal">

    <div class="modal-box">

        <h2>

            課程資料

        </h2>

        <label>

            課程名稱

        </label>

        <input
            id="courseName"
            type="text">

        <label>

            授課教師

        </label>

        <input
            id="teacherName"
            type="text">

        <label>

            教室

        </label>

        <input
            id="roomName"
            type="text">

        <label>

            學分

        </label>

        <input
            id="credit"
            type="number"
            min="0">

        <label>

            分類

        </label>

        <select
            id="category">

            <option>必修</option>

            <option>選修</option>

            <option>通識</option>

            <option>體育</option>

            <option>其他</option>

        </select>

        <label>

            顏色

        </label>

        <input
            id="color"
            type="color"
            value="#4CAF50">
        <div class="modal-buttons">

            <button
                id="deleteCourseBtn"
                class="danger">

                刪除

            </button>

            <button
                id="cancelBtn">

                取消

            </button>

            <button
                id="saveBtn">

                儲存

            </button>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="TimetableSystem/js/module.js"></script>
<script src="TimetableSystem/js/timetable.js"></script>
<script src="TimetableSystem/js/storage.js"></script>
<script src="TimetableSystem/js/ui.js"></script>
<script src="TimetableSystem/js/export.js"></script>
<script src="TimetableSystem/js/exportImage.js"></script>
<script src="TimetableSystem/js/import.js"></script>
<script src="TimetableSystem/js/excel.js"></script>
<script src="TimetableSystem/js/dragdrop.js"></script>
<script src="TimetableSystem/js/app.js"></script>

</body>
</html>
